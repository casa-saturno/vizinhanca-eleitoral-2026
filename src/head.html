<title>Vizinhança Eleitoral 2026</title>

<style>
/* Layout: mapa em tela cheia; barra de busca flutuante à esquerda; painel-boletim à direita (gaveta inferior no celular). */
:root {
  --bg: #dfe4e2;          /* fora do Brasil */
  --land: #f4f4ef;        /* município sem cor */
  --ink: #14181d;
  --ink-2: #464e57;
  --muted: #747c86;
  --panel: #fbfbf8;
  --panel-2: #eff0ec;

  --cell-line: #ffffff;
  --muni-line: #5d656d;
  --uf-line: #1d2228;
  --focus: #1f5fbf;
  --c-13: #c8102e;        /* Lula */
  --c-22: #1f5fbf;        /* Flávio Bolsonaro */
  --c-55: #c98500;        /* Ronaldo Caiado */
  --c-70: #16a39a;        /* Augusto Cury e demais no modo candidato */
  --c-outros: #8a9099;
  --empate: #9a8fb0;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,24,29,.08), 0 8px 24px rgba(20,24,29,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1016; --land: #1a2129; --ink: #eef1f4; --ink-2: #b9c0c8; --muted: #8a939d;
    --panel: #141a21; --panel-2: #1c232c; --rule: #2a323c; --cell-line: #0f141a; --muni-line: #8a949e; --uf-line: #dfe5ea;
    --focus: #4b8ef0; --c-13: #e5484d; --c-22: #4b8ef0; --c-55: #c98500; --c-70: #1aa89c; --c-outros: #79818b; --empate: #8b80a3;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1016; --land: #1a2129; --ink: #eef1f4; --ink-2: #b9c0c8; --muted: #8a939d;
  --panel: #141a21; --panel-2: #1c232c; --rule: #2a323c; --cell-line: #0f141a; --muni-line: #8a949e; --uf-line: #dfe5ea;
  --focus: #4b8ef0; --c-13: #e5484d; --c-22: #4b8ef0; --c-55: #c98500; --c-70: #1aa89c; --c-outros: #79818b; --empate: #8b80a3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}
/*__MAPLIBRE_CSS__*/
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
#map { position: fixed; inset: 0; }
.maplibregl-map { font-family: var(--font-body); }
.maplibregl-ctrl-top-right { right: calc(max(16px, env(safe-area-inset-right, 0px)) + min(384px, 30vw) + 4px); top: 6px; }
.maplibregl-ctrl-group { background: var(--panel); box-shadow: var(--shadow); }
.maplibregl-ctrl-group button + button { border-top-color: var(--rule); }
.maplibregl-ctrl button .maplibregl-ctrl-icon { filter: none; }
:root[data-theme="dark"] .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1); } }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted); }
.maplibregl-ctrl-attrib a { color: var(--ink-2); }

#ui { position: fixed; inset: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; display: grid; grid-template-columns: minmax(0, 400px) 1fr minmax(0, 384px); grid-template-rows: auto 1fr auto; gap: 12px; }
#ui > * { pointer-events: auto; }

/* Barra de comando */
.comando { grid-column: 1; grid-row: 1; background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); display: grid; gap: 10px; padding: 14px 14px 12px; align-self: start; min-width: 0; }
.marca { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.marca h1 { margin: 0; font-family: var(--font-display); font-stretch: 62%; font-weight: 800; font-size: 25px; line-height: 1; letter-spacing: -0.005em; text-transform: uppercase; text-wrap: balance; }
.marca h1 span { color: var(--muted); font-weight: 600; }
.link-sobre { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font: 500 12px/1 var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }
.link-sobre:hover { color: var(--ink); }
.sub { margin: -4px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.35; }
.busca { position: relative; }
.busca input { width: 100%; box-sizing: border-box; font: 500 15px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 40px 10px 12px; }
.busca input::placeholder { color: var(--muted); }

.btn-geo { position: absolute; right: 4px; top: 4px; width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.btn-geo:hover { background: var(--rule); color: var(--ink); }
.resultados { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); max-height: min(60vh, 420px); overflow: auto; z-index: 5; padding: 4px; margin: 0; list-style: none; }
.resultados li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.resultados li[aria-selected="true"], .resultados li:hover { background: var(--panel-2); }
.resultados .tipo { grid-row: span 2; font: 600 10px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; min-width: 52px; }
.resultados .t1 { font-weight: 600; }
.resultados .t2 { color: var(--muted); font-size: 12px; }
.resultados .vazio { display: block; color: var(--muted); cursor: default; }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 600 13px/1 var(--font-body); padding: 8px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg button:focus-visible, .link-sobre:focus-visible, .btn-geo:focus-visible, select:focus-visible, .lista button:focus-visible, .migalhas button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
select { font: 600 13px/1 var(--font-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 8px; max-width: 100%; }

/* Painel-boletim */
.painel { grid-column: 3; grid-row: 1 / span 3; background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; max-height: 100%; align-self: start; overflow: hidden; }
.painel-alca { display: none; }
.migalhas { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; padding: 12px 16px 0; font: 500 12px/1.4 var(--font-mono); color: var(--muted); }
.migalhas button { background: none; border: 0; padding: 0; color: var(--ink-2); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.migalhas .sep { color: var(--rule); }
.painel-corpo { overflow-y: auto; padding: 8px 16px 16px; min-height: 0; overscroll-behavior: contain; }
.bu-cab { font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; }
.painel h2 { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 26px; line-height: 1.05; margin: 6px 0 4px; text-wrap: balance; overflow-wrap: anywhere; }
.painel .end { color: var(--ink-2); font-size: 13px; line-height: 1.4; margin: 0 0 4px; overflow-wrap: anywhere; }
.aviso { font-size: 12px; line-height: 1.4; color: var(--ink-2); background: var(--panel-2); border-left: 3px solid var(--muted); padding: 6px 8px; margin: 8px 0; border-radius: 0 4px 4px 0; }
.serrilha { border: 0; height: 8px; margin: 12px -16px; background: radial-gradient(circle at 4px 0, transparent 3.5px, var(--panel) 4px) 0 0 / 8px 8px repeat-x, linear-gradient(var(--rule), var(--rule)) 0 0 / 100% 1px no-repeat; opacity: .9; }
.tracejado { border: 0; border-top: 1px dashed var(--rule); margin: 12px 0; }
.manchete { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; margin: 10px 0 2px; }
.manchete .chip { width: 12px; height: 34px; border-radius: 3px; grid-row: span 2; }
.manchete .q { font: 600 11px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.manchete .r { font-family: var(--font-display); font-stretch: 80%; font-weight: 700; font-size: 18px; line-height: 1.15; }
.cands { display: grid; gap: 10px; margin: 12px 0 4px; }
.cand { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.cand .nome { font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.cand .nome small { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.cand .num { font: 600 14px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.cand .barra { grid-column: 1 / -1; position: relative; height: 8px; background: var(--panel-2); border-radius: 2px; }
.cand .barra i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px 4px 4px 2px; }
.cand .barra b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.cand .det { grid-column: 1 / -1; font: 400 11.5px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cand.vence .nome::after { content: "venceu"; font: 600 9.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--panel); background: var(--ink); padding: 3px 5px; border-radius: 3px; margin-left: 2px; align-self: center; }
.ref { font: 400 11.5px/1.3 var(--font-mono); color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.ref b { display: inline-block; width: 2px; height: 12px; background: var(--ink); }
.mais { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font: 500 12px/1 var(--font-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.tabela { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font: 400 12.5px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; margin: 4px 0; }
.tabela dt { color: var(--ink-2); }
.tabela dd { margin: 0; text-align: right; color: var(--ink); }
.secao-tit { font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.filtro { width: 100%; box-sizing: border-box; font: 500 13px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; }
.filtro:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; }
.lista button { width: 100%; display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 8px 2px; color: var(--ink); font: inherit; cursor: pointer; }
.lista button:hover { background: var(--panel-2); }
.lista .dot { width: 10px; height: 10px; border-radius: 2px; }
.lista .l1 { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lista .l2 { grid-column: 2; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lista .v { grid-row: 1 / span 2; grid-column: 3; font: 600 12.5px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.dica { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 8px 0; }

/* Legenda */
.legenda { grid-column: 1; grid-row: 3; align-self: end; justify-self: start; background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; max-width: 100%; box-sizing: border-box; }
.legenda .tit { font: 600 10.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.leg-linha { display: grid; grid-template-columns: 112px auto; align-items: center; gap: 8px; margin: 3px 0; font-size: 12.5px; font-weight: 600; }
.leg-rampa { display: flex; gap: 2px; }
.leg-rampa i { width: 26px; height: 12px; border-radius: 1px; }
.leg-escala { display: grid; grid-template-columns: 112px auto; gap: 8px; }
.leg-escala div { display: flex; gap: 2px; font: 400 10px/1 var(--font-mono); color: var(--muted); }
.leg-escala span { width: 26px; text-align: center; }
.leg-extra { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; color: var(--ink-2); }
.leg-extra i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--rule); }

/* Rótulos e dica flutuante */
.rotulo { pointer-events: none; font: 600 11px/1 var(--font-body); color: var(--ink); white-space: nowrap; text-shadow: 0 0 2px var(--land), 0 0 3px var(--land), 0 0 5px var(--land); letter-spacing: .02em; }
.rotulo.uf { font: 800 13px/1 var(--font-display); font-stretch: 75%; letter-spacing: .08em; color: var(--ink-2); }
.rotulo.mun { font-weight: 700; font-size: 11.5px; }
.rotulo.bairro { font: 600 10px/1 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: 7px 9px; font-size: 12.5px; line-height: 1.35; max-width: 260px; }
#tip .tn { font-weight: 700; }
#tip .tv { font: 500 12px/1.3 var(--font-mono); color: var(--ink-2); }
.carregando { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); color: var(--ink-2); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font: 500 13px/1 var(--font-mono); z-index: 30; pointer-events: none; }

/* Sobre */
.sobre-fundo { position: fixed; inset: 0; background: rgba(10,14,18,.45); z-index: 40; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.sobre { background: var(--panel); color: var(--ink); border-radius: 12px; box-shadow: var(--shadow); max-width: 640px; width: 100%; max-height: 100%; overflow: auto; padding: 20px 22px; box-sizing: border-box; }
.sobre h2 { font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 26px; margin: 0 0 8px; text-transform: uppercase; }
.sobre h3 { font: 600 11px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.sobre p, .sobre li { line-height: 1.55; font-size: 14px; max-width: 65ch; color: var(--ink-2); }
.sobre ul { padding-left: 18px; margin: 0; }
.sobre a { color: var(--ink); }
.sobre .fechar { float: right; border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: 600 13px/1 var(--font-body); cursor: pointer; }

/* Celular: gaveta inferior */
@media (max-width: 760px) {
  #ui { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; padding-block: 10px 0; gap: 8px; }
  .comando { padding: 10px 12px; gap: 8px; }
  .marca h1 { font-size: 21px; }
  .sub { display: none; }
  .legenda { grid-row: 2; align-self: end; padding: 8px 10px; margin-bottom: 4px; }
  .leg-linha, .leg-escala { grid-template-columns: 92px auto; }
  .leg-rampa i, .leg-escala span { width: 20px; }
  .painel { grid-column: 1; grid-row: 3; border-radius: 12px 12px 0 0; max-height: 46vh; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-bottom: env(safe-area-inset-bottom, 0px); transition: max-height .2s ease; }

  .painel.recolhido .legenda-oculta { display: none; }
  .painel-alca { display: block; width: 100%; border: 0; background: none; padding: 8px 0 0; cursor: pointer; }
  .painel-alca span { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto; }
  .migalhas, .painel-corpo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .painel h2 { font-size: 22px; }
  .maplibregl-ctrl-top-right { display: none; }
}
@media (prefers-reduced-motion: reduce) { .painel { transition: none; } }
</style>
